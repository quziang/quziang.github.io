<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">中国科学院大学校徽</title>
  <desc id="desc">中国科学院大学采用的中国科学院院徽矢量图。</desc>
  <defs>
    <path id="topArc" d="M 77 256 A 179 179 0 0 1 435 256"/>
    <path id="bottomArc" d="M 435 256 A 179 179 0 0 1 77 256"/>
    <path id="crystal" d="M -26 -23 L -79 -105 L -35 -132 L 47 -67 L 32 -29 Z"/>
  </defs>

  <circle cx="256" cy="256" r="242" fill="#fff" stroke="#1555a5" stroke-width="9"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#1555a5" stroke-width="3"/>
  <circle cx="256" cy="256" r="157" fill="#fff" stroke="#1555a5" stroke-width="8"/>

  <g fill="#1555a5">
    <text font-family="STKaiti, KaiTi, 'Noto Serif SC', serif" font-size="38" font-weight="700" letter-spacing="13">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">中国科学院</textPath>
    </text>
    <text font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" letter-spacing="1.7">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">CHINESE ACADEMY OF SCIENCES</textPath>
    </text>
  </g>

  <g transform="translate(256 256)" fill="#1555a5">
    <use href="#crystal" transform="rotate(0)"/>
    <use href="#crystal" transform="rotate(60)"/>
    <use href="#crystal" transform="rotate(120)"/>
    <use href="#crystal" transform="rotate(180)"/>
    <use href="#crystal" transform="rotate(240)"/>
    <use href="#crystal" transform="rotate(300)"/>

    <g fill="#fff">
      <circle cx="0" cy="-77" r="8.5"/>
      <circle cx="67" cy="-39" r="8.5"/>
      <circle cx="67" cy="39" r="8.5"/>
      <circle cx="0" cy="77" r="8.5"/>
      <circle cx="-67" cy="39" r="8.5"/>
      <circle cx="-67" cy="-39" r="8.5"/>
      <path d="M0-32 L9-25 L21-27 L26-16 L36-9 L32 3 L36 14 L25 21 L21 33 L9 30 L0 38 L-9 30 L-21 33 L-25 21 L-36 14 L-32 3 L-36-9 L-26-16 L-21-27 L-9-25 Z"/>
    </g>
    <circle cx="0" cy="0" r="13" fill="#1555a5"/>
  </g>
