name: Capture site screenshots

on:
  push:
    paths:
      - '.github/workflows/capture-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare capture environment
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq fonts-noto-cjk poppler-utils
          fc-cache -f
          (google-chrome --version || chromium-browser --version || chromium --version)

      - name: Extract standalone UCAS emblem viewport from official vector sheet
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://www.ucas.ac.cn/docs//2023-07/45f41b07373b4c15bfcc5816cc35c0e9.zip' -o /tmp/ucas.zip
          rm -rf /tmp/ucas && mkdir -p /tmp/ucas
          unzip -q /tmp/ucas.zip -d /tmp/ucas
          AI_FILE="$(find /tmp/ucas -type f -iname '*.ai' | head -1)"
          test -n "$AI_FILE"
          pdftocairo -svg "$AI_FILE" /tmp/ucas-full.svg
          grep -aq '<svg' /tmp/ucas-full.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.register_namespace('', 'http://www.w3.org/2000/svg')
          ET.register_namespace('xlink', 'http://www.w3.org/1999/xlink')
          tree = ET.parse('/tmp/ucas-full.svg')
          root = tree.getroot()
          # Official standard-colour standalone emblem; coordinates mapped from the original AI/PDF artboard.
          root.set('viewBox', '445.06165 1975.94282 323.32420 323.32420')
          root.set('width', '512')
          root.set('height', '512')
          root.set('preserveAspectRatio', 'xMidYMid meet')
          tree.write('assets/ucas-emblem.svg', encoding='utf-8', xml_declaration=True)
          PY
          grep -aq '<svg' assets/ucas-emblem.svg
          file assets/ucas-emblem.svg
          ls -lh assets/ucas-emblem.svg

      - name: Commit corrected UCAS emblem
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ucas-emblem.svg
          if ! git diff --cached --quiet; then
            git commit -m 'assets: use standalone official UCAS emblem viewport'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Serve current source
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/site-server.log 2>&1 &
          echo $! >/tmp/site-server.pid
          for i in {1..20}; do
            if curl -fsSL http://127.0.0.1:8000/ >/tmp/index.html; then break; fi
            sleep 1
          done
          test -s /tmp/index.html

      - name: Capture desktop
        shell: bash
        run: |
          set -euxo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,1200 --virtual-time-budget=3000 --screenshot=quziang-desktop.png http://127.0.0.1:8000/
          file quziang-desktop.png

      - name: Capture mobile
        shell: bash
        run: |
          set -euxo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=390,844 --virtual-time-budget=3000 --screenshot=quziang-mobile.png http://127.0.0.1:8000/
          file quziang-mobile.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: quziang-site-screenshots-final2
          path: |
            quziang-desktop.png
            quziang-mobile.png
          if-no-files-found: error
          retention-days: 1
