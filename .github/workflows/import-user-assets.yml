name: Import user SVG assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-user-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct uploaded SVGs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p site/public/assets
          cat .asset-import/ucas.part* | base64 -d | gzip -d > site/public/assets/ucas-emblem.svg
          base64 -d .asset-import/experience-logo.gz.b64 | gzip -d > site/public/assets/experience-logo.svg
          base64 -d .asset-import/alibaba.gz.b64 | gzip -d > site/public/assets/alibaba.svg

          test "$(git hash-object site/public/assets/ucas-emblem.svg)" = "079f4d683aa07bdde3a5d63729c01e1fef4f1056"
          test "$(git hash-object site/public/assets/experience-logo.svg)" = "ece5c2f3cebe1037326504b53672737a4fec6926"
          test "$(git hash-object site/public/assets/alibaba.svg)" = "bb458d7ed019ddff05f12b4ccc99c140325f8a2c"

      - name: Commit source assets
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .asset-import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'assets: use uploaded experience vectors'
          git push origin main
