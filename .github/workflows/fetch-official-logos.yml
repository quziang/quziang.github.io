name: Fetch official logo assets

on:
  push:
    paths:
      - '.github/workflows/fetch-official-logos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Convert UCAS official AI/PDF vector to SVG
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://www.ucas.ac.cn/docs//2023-07/45f41b07373b4c15bfcc5816cc35c0e9.zip' -o /tmp/ucas.zip
          rm -rf /tmp/ucas && mkdir -p /tmp/ucas
          unzip -q /tmp/ucas.zip -d /tmp/ucas
          AI_FILE="$(find /tmp/ucas -type f -iname '*.ai' | head -1)"
          test -n "$AI_FILE"
          file "$AI_FILE"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq poppler-utils
          pdftocairo -svg "$AI_FILE" assets/ucas-emblem.svg
          file assets/ucas-emblem.svg
          ls -lh assets/ucas-emblem.svg
          head -n 3 assets/ucas-emblem.svg

      - name: Inspect CTFile download implementation for NEFU mirror
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://webstatic.ctfile.com/assets/js/otherdownload.js?v=20260501' -o /tmp/otherdownload.js
          echo '----- relevant otherdownload.js lines -----'
          grep -nEi 'template_url|download|file|pass|code|ajax|api|url' /tmp/otherdownload.js | head -240 || true
          echo '----- complete script -----'
          cat /tmp/otherdownload.js

      - name: Commit official UCAS SVG
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ucas-emblem.svg
          if ! git diff --cached --quiet; then
            git commit -m 'assets: use official UCAS vector source'
            git pull --rebase origin main
            git push origin main
          fi
