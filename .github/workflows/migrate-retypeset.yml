name: Migrate to Retypeset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-retypeset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run migration
        run: bash .github/scripts/migrate-retypeset.sh
