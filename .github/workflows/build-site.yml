name: Build Retypeset site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retypeset-publish-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: Build Retypeset
        working-directory: site
        run: pnpm build

      - name: Check build freshness
        id: freshness
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin main
          if git diff --quiet "$GITHUB_SHA" "origin/main" -- site/; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer site source commit exists; skipping stale publish.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Sync generated site to Pages root
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'site/' \
            --exclude 'CNAME' \
            site/dist/ ./
          touch .nojekyll

      - name: Commit generated Pages output
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish Retypeset site'
            git pull --rebase origin main
            git push origin main
          fi
