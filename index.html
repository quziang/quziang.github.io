<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="quziang — personal homepage">
  <title>quziang</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="wrap header-inner">
      <a class="wordmark" href="#top">quziang</a>
      <div class="header-actions">
        <a href="#education" data-zh="教育" data-en="Education">教育</a>
        <a href="https://github.com/quziang" target="_blank" rel="noreferrer">GitHub</a>
        <button id="langToggle" type="button" aria-label="Switch language">EN</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero wrap">
      <h1 class="hero-name">quziang</h1>
      <div class="hero-info">
        <p data-zh="中国科学院大学" data-en="University of Chinese Academy of Sciences">中国科学院大学</p>
        <p data-zh="硕士研究生 · 2024—2027" data-en="Master's Student · 2024—2027">硕士研究生 · 2024—2027</p>
      </div>
    </section>

    <section class="education wrap" id="education">
      <div class="education-heading">
        <span>EDUCATION</span>
        <h2 data-zh="教育经历" data-en="Education">教育经历</h2>
      </div>

      <div class="edu-list">
        <article class="edu-item">
          <div class="logo">
            <span class="logo-fallback">UCAS</span>
            <img src="https://news.ucas.ac.cn/images/2023-10/00054aec6de543d4981cb764b90a4387.png" alt="中国科学院大学校徽" onerror="this.style.display='none'; this.previousElementSibling.style.display='flex';">
          </div>
          <div class="school">
            <h3 data-zh="中国科学院大学" data-en="University of Chinese Academy of Sciences">中国科学院大学</h3>
            <p data-zh="硕士研究生" data-en="Master's Student">硕士研究生</p>
          </div>
          <time>2024—2027</time>
        </article>

        <article class="edu-item">
          <div class="logo">
            <span class="logo-fallback">NEFU</span>
            <img class="nefu-logo" src="https://culture.nefu.edu.cn/images/home_80.png" alt="东北林业大学校徽" onerror="this.style.display='none'; this.previousElementSibling.style.display='flex';">
          </div>
          <div class="school">
            <h3 data-zh="东北林业大学" data-en="Northeast Forestry University">东北林业大学</h3>
            <p data-zh="本科" data-en="Bachelor's Degree">本科</p>
          </div>
          <time>2020—2024</time>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer wrap">
    <span>© <span id="year"></span> quziang</span>
    <a href="https://github.com/quziang" target="_blank" rel="noreferrer">GitHub ↗</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
