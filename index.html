<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="quziang — personal homepage">
  <title>quziang</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="page-grid topbar-grid">
      <a class="micro-mark" href="#top" aria-label="quziang home">QZ</a>
      <div class="topbar-right">
        <a class="github-link" href="https://github.com/quziang" target="_blank" rel="noreferrer">GitHub ↗</a>
        <div class="language-switch" aria-label="Language">
          <button class="lang-option" type="button" data-lang="zh">中</button>
          <span>/</span>
          <button class="lang-option" type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero page-grid">
      <div class="hero-main">
        <h1 class="display-name" aria-label="quziang">
          <span>QU</span>
          <span>ZIANG</span>
        </h1>
        <div class="hero-meta">
          <p data-zh="硕士研究生" data-en="Master's Student">硕士研究生</p>
          <p data-zh="中国科学院大学" data-en="University of Chinese Academy of Sciences">中国科学院大学</p>
        </div>
      </div>
      <div class="hero-void" aria-hidden="true"></div>
    </section>

    <section class="education" id="education">
      <div class="page-grid section-head">
        <div class="section-code">01</div>
        <div class="section-title-wrap">
          <p class="section-kicker">EDUCATION</p>
          <h2 data-zh="教育经历" data-en="Education">教育经历</h2>
        </div>
      </div>

      <div class="edu-table">
        <article class="edu-row page-grid">
          <div class="edu-year">
            <span>2024</span>
            <span class="year-dash">—</span>
            <span>2027</span>
          </div>
          <div class="edu-detail">
            <div class="school-emblem">
              <img src="assets/ucas-emblem.svg" alt="中国科学院大学校徽">
            </div>
            <div class="school-copy">
              <h3 data-zh="中国科学院大学" data-en="University of Chinese Academy of Sciences">中国科学院大学</h3>
              <p data-zh="硕士研究生" data-en="Master's Student">硕士研究生</p>
            </div>
          </div>
        </article>

        <article class="edu-row page-grid">
          <div class="edu-year">
            <span>2020</span>
            <span class="year-dash">—</span>
            <span>2024</span>
          </div>
          <div class="edu-detail">
            <div class="school-emblem">
              <img src="assets/nefu-emblem.svg" alt="东北林业大学校徽">
            </div>
            <div class="school-copy">
              <h3 data-zh="东北林业大学" data-en="Northeast Forestry University">东北林业大学</h3>
              <p data-zh="本科" data-en="Bachelor's Degree">本科</p>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer class="footer page-grid">
    <div>© <span id="year"></span> quziang</div>
    <div class="footer-note" data-zh="个人主页" data-en="Personal site">个人主页</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
