<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="quziang — personal homepage">
  <meta name="color-scheme" content="light">
  <title>quziang</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="site-shell" id="top">
    <aside class="identity-column">
      <div class="identity-inner">
        <header class="site-header">
          <h1 class="site-title"><a href="#top">quziang</a></h1>
          <div class="site-subtitle">
            <p data-zh="中国科学院大学" data-en="University of Chinese Academy of Sciences">中国科学院大学</p>
            <p data-zh="硕士研究生" data-en="Master's Student">硕士研究生</p>
          </div>
        </header>

        <nav class="site-nav" aria-label="Site navigation">
          <ul>
            <li>
              <a class="nav-link is-active" href="#education" data-zh="教育" data-en="Education">教育</a>
            </li>
            <li>
              <a class="nav-link" href="https://github.com/quziang" target="_blank" rel="noreferrer">GitHub</a>
            </li>
          </ul>
        </nav>

        <div class="language-switch" aria-label="Language">
          <button class="lang-option" type="button" data-lang="zh">中</button>
          <span aria-hidden="true">/</span>
          <button class="lang-option" type="button" data-lang="en">EN</button>
        </div>
      </div>
    </aside>

    <main class="main-column">
      <section class="content-section" id="education">
        <div class="decorative-line" aria-hidden="true"></div>
        <h2 class="section-title" data-zh="教育经历" data-en="Education">教育经历</h2>

        <ol class="education-list">
          <li class="education-item">
            <img class="school-emblem" src="assets/ucas-emblem.svg" alt="中国科学院大学校徽 / UCAS emblem">
            <div class="education-copy">
              <div class="education-heading">
                <h3 data-zh="中国科学院大学" data-en="University of Chinese Academy of Sciences">中国科学院大学</h3>
                <time datetime="2024/2027">2024—2027</time>
              </div>
              <p data-zh="硕士研究生" data-en="Master's Student">硕士研究生</p>
            </div>
          </li>

          <li class="education-item">
            <img class="school-emblem" src="assets/nefu-emblem.svg" alt="东北林业大学校徽 / Northeast Forestry University emblem">
            <div class="education-copy">
              <div class="education-heading">
                <h3 data-zh="东北林业大学" data-en="Northeast Forestry University">东北林业大学</h3>
                <time datetime="2020/2024">2020—2024</time>
              </div>
              <p data-zh="本科" data-en="Bachelor's Degree">本科</p>
            </div>
          </li>
        </ol>
      </section>

      <footer class="site-footer">
        <p><a class="footer-link" href="https://github.com/quziang" target="_blank" rel="noreferrer">GitHub</a></p>
        <p>© <span id="year"></span> quziang</p>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
